# Local development stack. Not production. Versions pinned; bump deliberately.
# NOTE: authored in Sprint 0 but NOT yet started in CI — first `docker compose up` is Sprint 1 task I-01.
services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    volumes: [nats-data:/data]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: market
      CLICKHOUSE_USER: dev
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set in .env}
    ports: ["8123:8123", "9000:9000"]
    volumes:
      - ch-data:/var/lib/clickhouse
      - ./clickhouse:/docker-entrypoint-initdb.d:ro
    ulimits: { nofile: { soft: 262144, hard: 262144 } }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    ports: ["5432:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]

  centrifugo:
    image: centrifugo/centrifugo:v5
    command: centrifugo -c /centrifugo/config.json
    environment:
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_SECRET:?set in .env}
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:?set in .env}
    ports: ["8000:8000"]
    volumes: [./centrifugo:/centrifugo:ro]

volumes: { nats-data: {}, ch-data: {}, pg-data: {} }
