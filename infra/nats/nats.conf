# Local development NATS (JetStream). Not production.
port: 4222
http_port: 8222
jetstream {
  store_dir: "/data"
  # Accounting limit, not an allocation: each stream reserves its MaxBytes against it
  # (bus.DefaultStreams reserves 26 GiB); disk is only used by what is actually written.
  # Without it the server allows 75% of the free disk, and stream creation fails on small disks.
  # Production must provision real disk for the full reservation (contracts/subjects.md).
  max_file_store: 64G
}
